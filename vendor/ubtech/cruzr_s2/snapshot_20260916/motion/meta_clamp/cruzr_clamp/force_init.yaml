meta_name: MetaClamp
#hqp_params
var_damping: [99, 99, 99, 99, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9]
acc_damping: [9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9, 9]
right_hand: [1, 1, 1, 0.3, 0.3, 0.3]
left_hand: [1, 1, 1, 0.3, 0.3, 0.3]
torso: [0, 0.0, 0.0, 0.3, 0.3, 0.3]
#task_request
request:
  duration: 0.3
  frequency: 500
  urdf_name: "cruzr_s2"
  biped_quit: true
  box_size: [0.4, 0.6, 0.29]
  position_rotation_limit_data:
    - position_rotation_limit_low: [0.4, -0.1, -0.1, -0.5, -0.5, -0.4]
      position_rotation_limit_up: [1.3, 0.1, 1.7, 0.5, 0.5, 0.4]

  component_disable_time:
    - [0.0, 0.0]
  enable_payload_iden: false
  enable_init_force_sensor: true
  task_type: "clamp_box"
  task_stack: task_stack_cruzr_clamp_manipulability.yaml
  robot_trajectory_data:
    - body_name: "left_hand"
      data:
        - timestamp: 0.3
          position: [-0.0, 0.0, -0.0] # x y z
          orientation: [1.0, 0.0, 0.0, 0.0] # w x y z
          tranform_mode: "RELATIVE"
    - body_name: "right_hand"
      data:
        - timestamp: 0.3
          position: [-0.0, 0.0, -0.0] # x y z
          orientation: [1.0, 0.0, 0.0, 0.0] # w x y z
          tranform_mode: "RELATIVE"
    - body_name: "torso"
      data:
        - timestamp: 0.3
          position: [-0.0, 0, 0] # x y z
          orientation: [1.0, 0.0, 0.0, 0.0] # w x y z
          tranform_mode: "ABSOLUTE"
