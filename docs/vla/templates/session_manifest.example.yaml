  video_decode_passed: false
  dimensions_passed: false
  timestamp_monotonicity_passed: false
  synchronization_passed: false
  unique_rgb_frame_rate_measured: false
  automatic_qc_report: null
  human_review_complete: false
  accepted_episodes: 0
  rejected_episodes: 0
  pending_episodes: 0
  mission_phase_sequence_passed: false
  navigation_goals_linked: false
  apriltag_pre_post_errors_stored: false
  workbin_detections_stored: false
  costmap_profile_restoration_passed: false
  accepted_missions: 0
  rejected_missions: 0

provenance:
