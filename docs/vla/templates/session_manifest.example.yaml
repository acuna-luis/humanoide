  files_inventory_sha256: "TODO_AFTER_SESSION"
  primary_storage_uri: "TODO_INTERNAL_URI"
  backup_storage_uri: "TODO_INTERNAL_URI"

closure:
  notes: "TODO"
  released_for_training: false
  approved_by: null
