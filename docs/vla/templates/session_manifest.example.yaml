# Copiar como <session_id>/session_manifest.yaml y reemplazar todos los TODO.
# No almacenar contraseñas, tokens ni datos personales innecesarios.
schema_version: "1.1"
session:
  id: "TODO_YYYYMMDD_SITE_TASK_RUNNN"
  started_at: "TODO_ISO8601_WITH_TIMEZONE"
  ended_at: null
  site: "TODO"
  purpose: "hybrid_box_transfer_teleoperation_dataset"
  status: "open" # open | quarantined | qc_passed | released

people:
  technical_lead_id: "TODO_PSEUDONYM_OR_INTERNAL_ID"
  teleoperator_id: "TODO_PSEUDONYM_OR_INTERNAL_ID"
  safety_observer_id: "TODO_PSEUDONYM_OR_INTERNAL_ID"

robot:
  model: "Cruzr S2"
  serial: "TODO"
  motion_image: "zs2_motion-v0.2.0"
  vision_image: "zs2_vision-v0.2.0"
  exact_dac_build_confirmed: false
  exact_dac_build_note: "Pending DSA confirmation"
  hw_type: "cruzr_s2_v1"
  end_effector: "passive_side_clamps"
  tele_device: "pico"
  transmit: "local"
  charger_disconnected: true
  initial_battery_soc_percent: [null, null]
  final_battery_soc_percent: [null, null]
  config_hashes:
    motion_environment_sha256: "TODO"
    controller_config_sha256: "TODO"

xr:
  headset: "PICO 4 Ultra Enterprise"
  system_version: "TODO"
  xrobotoolkit_pico_version: "1.1.1"
  xrobotoolkit_pc_service_version: "1.0.0"
  ubt_controller_version: "5.3.0"
  ubt_remote_control_version: "4.1.0"
  transport: "usb_shared_network"
  wifi_disabled_during_run: true
  configured_push_rate_hz: 90
  mode: "head_and_controller" # or full_body_high_accuracy
  tracker_count: 0
  tracker_layout: "none"
  calibrated_this_session: true
  calibration_notes: "TODO"

capture:
  recorder_name: "TODO_CONFIRM_VENDOR_CAPTURE_CENTER"
  recorder_version: "TODO"
  export_format: "TODO_EXPECTED_LEROBOT_V2_1"
  clock_master: "TODO"
  synchronization_method: "TODO"
  output_root_logical_name: "TODO_SESSION_ID"
  modalities:
    rgb:
      topic: "/sensor/camera/stereo/color/raw"
      type: "shm_msgs/msg/Image2m"
      width: 960
      height: 576
      measured_rate_hz: null
      declared_dataset_fps: null
      codec_actual: "TODO_INSPECT_EXPORTED_VIDEO"
    state:
      source_topic: "/mc/whole_joint_states"
      dimensions: 20
      order_profile: "utars_1rgb_20d_v1"
      units: "TODO_CONFIRM_RAD_OR_VENDOR_CONTRACT"
      measured_rate_hz: null
    action:
      dimensions: 20
      order_profile: "utars_1rgb_20d_v1"
      units: "TODO_CONFIRM_RAD_OR_VENDOR_CONTRACT"
      measured_rate_hz: null
    force_torque:
      stored: true
      used_by_current_model: false
      left_topic: "/mc/ft_states/L_hand_ft"
      right_topic: "/mc/ft_states/R_hand_ft"
      dimensions: 12
    xr_raw:
      stored: true
      expected_files:
        - "head.txt"
        - "hand.txt"
        - "controller.txt"
        - "body.csv"
        - "motion.txt"
  sidecar:
    enabled: true
    continuous_across_mission: true
    phase_events_explicit: true
    topics:
      odometry: "/mc/odom"
      map_pose: "/nav/robot_pose"
      base_command_requested: "/cmd_vel_navi"
      base_command_effective: "/mc/cmd_vel"
      apriltag_results: "/sensor/camera/stereo/april_tag/results"
      estop: "/emb/estop_key_state"
      servo_estop: "/emb/servo_estop_key_state"
      charger: "/emb/chrg_input_status"
      battery: "/emb/battery_state"
      tf: "/tf"
      tf_static: "/tf_static"
    actions:
      navigation: "/vnav/task/command"
      workbin_detection: "/cv/task/transport_action"
    action_stream_20d_confirmed_with_dsa: false
    image2m_pixels_verified_in_export: false

map_and_layout:
  map_name: "TODO"
  map_fingerprint_sha256: "TODO"
  layout_version: "TODO"
  costmap_profile_default_sha256: "TODO"
  cargo_perception_profile_sha256: "TODO"
  cargo_profile_restored_after_test: false
  waypoints:
    - id: "MESA1_PRE"
      mode: "logo_nav"
      x_m: null
      y_m: null
      yaw_rad: null
    - id: "MESA2_PRE"
      mode: "logo_nav"
      x_m: null
      y_m: null
      yaw_rad: null

box_catalog:
  - box_id: "TODO_BOX_001"
    family: "workbin"
    dimensions_m: {length: 0.60, width: 0.40, height: 0.22}
    measured_mass_kg: null
    material: "rigid_plastic"
    rigidity: "rigid"
    color: "blue"
    load_state: "empty"
    center_of_mass_note: "TODO"
    allowed_contact_surfaces: ["left_side", "right_side"]
    detector_profile: "byd_workbin_0.60x0.40x0.22"
    detector_dimensions_m: {x: 0.60, y: 0.40, z: 0.22}

station_catalog:
  - station_id: "MESA1"
    role: "pick"
    height_m: null
    approach_waypoint: "MESA1_PRE"
    apriltag:
      enabled: true
      id: 112
      family: "tag36h11"
      black_square_size_m: 0.075
      frame: "mesa1_tag112"
      target_pose_reference: "TODO"
  - station_id: "MESA2"
    role: "drop"
    height_m: null
    approach_waypoint: "MESA2_PRE"
    apriltag:
      enabled: true
      id: 113
      family: "tag36h11"
      black_square_size_m: 0.0735
      frame: "mesa2_tag113"
      target_pose_reference: "TODO"

mission_plan:
  route_profile: "direct_mesa1_to_mesa2"
  include_unnecessary_intermediate_waypoints: false
  phases:
    - "NAV_PICK_PRE"
    - "ALIGN_PICK"
    - "PICK"
    - "RETREAT_PICK"
    - "NAV_DROP_PRE"
    - "ALIGN_DROP"
    - "PLACE"
    - "RETREAT_HOME"
  vla_recorded_phases: ["PICK", "PLACE"]
  sidecar_recorded_phases: ["NAV_PICK_PRE", "ALIGN_PICK", "PICK", "RETREAT_PICK", "NAV_DROP_PRE", "ALIGN_DROP", "PLACE", "RETREAT_HOME"]

policy_target:
  base_model: "nvidia/GR00T-N1.5-3B"
  starting_checkpoint: "checkpoint-40000"
  data_config: "Utars_1RGBDataConfig"
  observation_rgb_count: 1
  state_dimensions: 20
  action_dimensions: 20
  action_horizon: 10
  force_conditioned: false
  chassis_controlled: false
  fingers_controlled: false

task_catalog:
  - task_id: 4
    instruction: "Pick up the blue workbin from the table."
    initial_state: "Official ready pose at the marked pre-pick zone"
    success_condition: "Workbin suspended stably for one second without slip"
    abort_condition: "Collision, excessive force, visual loss, unstable clamp or E-stop"

variation_plan:
  object_family: "blue_workbin"
  object_ids: ["TODO"]
  heights_m: [null]
  lateral_offsets_m: [null]
  depth_offsets_m: [null]
  yaw_degrees: [null]
  lighting_conditions: ["TODO"]
  backgrounds: ["TODO"]
