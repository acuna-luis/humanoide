# Apply after upstream v2.79.0/docker-compose.yml with --project-name app2-cvat.
# Requires Docker Compose >= 2.24.4 (!reset / !override).
# No credentials: retain vendor's private, project-scoped backend network.
name: app2-cvat

services:
  cvat_db:
    container_name: !reset null
  cvat_redis_inmem:
    container_name: !reset null
  cvat_redis_ondisk:
    container_name: !reset null
  cvat_server:
    container_name: !reset null
    networks:
      cvat:
        aliases: !override [cvat-server]
    environment:
      CVAT_BASE_URL: http://localhost:18080
      # OPA fetches its authorization bundle directly from this internal alias.
      ALLOWED_HOSTS: localhost,127.0.0.1,cvat-server,cvat_server
  cvat_worker_utils:
    container_name: !reset null
    environment: &app2-backend-env
      CVAT_BASE_URL: http://localhost:18080
  cvat_worker_import:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_worker_export:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_worker_annotation:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_worker_webhooks:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_worker_quality_reports:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_worker_chunks:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_worker_consensus:
    container_name: !reset null
    environment: *app2-backend-env
  cvat_ui:
    container_name: !reset null
  cvat_opa:
    container_name: !reset null
    networks:
      cvat:
        aliases: !override [opa]
  cvat_clickhouse:
    container_name: !reset null
    networks:
      cvat:
        aliases: !override [clickhouse]
  cvat_vector:
    container_name: !reset null
    networks:
      cvat:
        aliases: !override [vector]
  cvat_grafana:
    container_name: !reset null
    networks:
      cvat:
        aliases: !override [grafana]
    environment:
      GF_SERVER_ROOT_URL: http://localhost:18080/analytics
  traefik:
    container_name: !reset null
    ports: !override
      - target: 8080
        published: "18080"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: app2-cvat_cvat
      TRAEFIK_PROVIDERS_DOCKER_CONSTRAINTS: Label(`com.docker.compose.project`,`app2-cvat`)

networks:
  cvat:
    name: app2-cvat_cvat
