[Service]
# The vendor unit used SIGINT with KillMode=control-group.  The background
# controller ignores SIGINT while run.sh waits for it, so every normal stop
# consumed the full 90-second systemd timeout.  Signal the supervising shell
# with SIGTERM; its cleanup trap then stops the controller and PICO service.
KillSignal=SIGTERM
KillMode=mixed
TimeoutStopSec=15s
